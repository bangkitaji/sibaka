# /etc/nginx/sites-available/sibaka.conf
# SIBAKA Portal - Nginx Configuration
# TLS 1.3 via Let's Encrypt, gzip, static file serving, PHP-FPM 8.3+

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name sibaka.example.com;
    return 301 https://$server_name$request_uri;
}

# Main HTTPS server block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sibaka.example.com;

    # SSL Configuration (Let's Encrypt via Certbot)
    ssl_certificate /etc/letsencrypt/live/sibaka.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sibaka.example.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/sibaka.example.com/chain.pem;

    # TLS 1.3 only
    ssl_protocols TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Document root (symlinked to current release)
    root /var/www/sibaka/current/public;
    index index.php;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml
        font/woff2;

    # Vite build output (immutable, long cache)
    location /build/ {
        alias /var/www/sibaka/current/public/build/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # User uploads served by Nginx directly
    location /storage/ {
        alias /var/www/sibaka/storage/app/public/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;

        # Prevent PHP execution in uploads directory
        location ~* \.php$ {
            deny all;
        }
    }

    # Favicon and robots (reduce log noise)
    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    # Laravel application
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM processing
    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;

        # Timeouts
        fastcgi_connect_timeout 60s;
        fastcgi_send_timeout 60s;
        fastcgi_read_timeout 60s;

        # Buffers
        fastcgi_buffer_size 16k;
        fastcgi_buffers 4 16k;
    }

    # Deny access to dotfiles (except .well-known for Let's Encrypt)
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # File upload limit (10MB per file, 50MB total for multipart)
    client_max_body_size 50M;

    # Logging
    access_log /var/log/nginx/sibaka-access.log;
    error_log /var/log/nginx/sibaka-error.log;
}
