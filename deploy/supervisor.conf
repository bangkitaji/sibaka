; /etc/supervisor/conf.d/sibaka.conf
; SIBAKA Portal - Supervisor Configuration
; Queue workers (default + notifications) and scheduler

[program:sibaka-queue-default]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/sibaka/current/artisan queue:work redis --sleep=3 --tries=3 --max-time=3600 --backoff=30,60,120
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/log/supervisor/sibaka-queue-default.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stopwaitsecs=3600

[program:sibaka-queue-notifications]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/sibaka/current/artisan queue:work redis --queue=notifications --sleep=3 --tries=3 --max-time=3600 --backoff=30,60,120
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/supervisor/sibaka-queue-notifications.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stopwaitsecs=3600

[program:sibaka-scheduler]
process_name=%(program_name)s
command=php /var/www/sibaka/current/artisan schedule:work
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/supervisor/sibaka-scheduler.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=3
stopwaitsecs=10
